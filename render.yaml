services:
  - type: web
    name: oceanembed-api
    runtime: python
    rootDir: .
    buildCommand: git lfs pull && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://ocean-embed.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
